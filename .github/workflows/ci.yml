name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/phi2-eo-tile-filter/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "examples/phi2-eo-tile-filter[dev]"
      - name: Compile
        run: python -m compileall -q assurance examples/phi2-eo-tile-filter
      - name: Test
        working-directory: examples/phi2-eo-tile-filter
        run: python -m pytest -q
      - name: Smoke demo
        working-directory: examples/phi2-eo-tile-filter
        run: python scripts/run_demo.py --n 96 --size 32 --bands 7 --epochs 1 --seed 0 --output-root /tmp/phi2-demo
