name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            install-mode: "ranges"
            run-smoke: false
          - python-version: "3.12"
            install-mode: "reference"
            run-smoke: true
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            examples/phi2-eo-tile-filter/pyproject.toml
            examples/phi2-eo-tile-filter/requirements-reference.txt
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.install-mode }}" = "reference" ]; then
            python -m pip install -r examples/phi2-eo-tile-filter/requirements-reference.txt
            python -m pip install --no-deps -e examples/phi2-eo-tile-filter
          else
            python -m pip install -e "examples/phi2-eo-tile-filter[dev]"
          fi
      - name: Lint critical errors
        if: matrix.python-version == '3.12'
        run: >-
          python -m ruff check
          --config examples/phi2-eo-tile-filter/pyproject.toml
          assurance examples/phi2-eo-tile-filter
      - name: Compile
        run: python -m compileall -q assurance examples/phi2-eo-tile-filter
      - name: Test
        working-directory: examples/phi2-eo-tile-filter
        run: python -m pytest -q
      - name: Smoke demo
        if: matrix.run-smoke
        working-directory: examples/phi2-eo-tile-filter
        run: >-
          python scripts/run_demo.py
          --n 96 --size 32 --bands 7 --epochs 1 --seed 0
          --output-root /tmp/phi2-demo-a
      - name: Repeat seeded demo
        if: matrix.run-smoke
        working-directory: examples/phi2-eo-tile-filter
        run: >-
          python scripts/run_demo.py
          --n 96 --size 32 --bands 7 --epochs 1 --seed 0
          --output-root /tmp/phi2-demo-b
      - name: Verify deterministic scientific outputs
        if: matrix.run-smoke
        working-directory: examples/phi2-eo-tile-filter
        run: >-
          python scripts/check_reproducibility.py
          /tmp/phi2-demo-a /tmp/phi2-demo-b
      - name: Robustness benchmark smoke
        if: matrix.run-smoke
        working-directory: examples/phi2-eo-tile-filter
        run: >-
          python scripts/run_robustness_benchmark.py
          --output-root /tmp/phi2-demo-a
          --samples-per-category 2
          --seed 101
          --event-prevalences 0.01,0.05,0.10
      - name: Verify robustness artifacts
        if: matrix.run-smoke
        working-directory: examples/phi2-eo-tile-filter
        run: >-
          python scripts/check_robustness_outputs.py
          /tmp/phi2-demo-a --samples-per-category 2
